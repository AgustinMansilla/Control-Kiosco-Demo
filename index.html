<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Control Kiosco · Personal</title><style>
        :root { --bg:#f5f7fb; --panel:#fff; --text:#142033; --muted:#64748b; --border:#e2e8f0; --navy:#17345f; --blue:#2563eb; }
        *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
        .contenedor{width:min(520px,100%);margin:auto;padding:26px 14px 44px}.cabecera{text-align:center;margin:4px 0 24px}.marca{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:#2563eb;background:#eaf2ff;padding:7px 10px;border-radius:999px}.cabecera h1{font-size:34px;margin:10px 0 4px;letter-spacing:-.7px}.fecha{color:var(--muted);font-size:14px}
        .turno{background:var(--panel);border:1px solid var(--border);border-radius:20px;margin-bottom:15px;overflow:hidden;box-shadow:0 8px 24px rgba(15,23,42,.05)}.turno-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:linear-gradient(135deg,#edf4ff,#f8fbff);border-bottom:1px solid #dce7f5}.horario{font-weight:850;font-size:17px}.cantidad{font-size:12px;color:var(--muted);font-weight:700}.ayer{display:inline-block;margin-left:6px;background:#fef3c7;color:#92400e;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:850}
        .empleado{display:flex;align-items:center;gap:13px;padding:17px 16px;text-decoration:none;color:inherit;border-bottom:1px solid #edf1f5;min-height:72px}.empleado:last-child{border-bottom:0}.empleado:active{background:#fff8d6}.empleado-simple{min-height:66px;padding:18px 16px}.empleado-simple .nombre{font-size:19px}.punto{width:12px;height:12px;border-radius:50%;background:#94a3b8;flex-shrink:0;box-shadow:0 0 0 4px rgba(148,163,184,.12)}.punto.trabajando{background:#16a34a;box-shadow:0 0 0 4px rgba(22,163,74,.12)}.punto.pendiente{background:#f59e0b;box-shadow:0 0 0 4px rgba(245,158,11,.12)}.punto.cobrado{background:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.12)}.punto.falta{background:#dc2626;box-shadow:0 0 0 4px rgba(220,38,38,.12)}.datos{flex:1;min-width:0}.nombre{font-size:18px;font-weight:850}.estado{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.35}.estado.activo{color:#15803d;font-weight:750}.estado.pendiente{color:#a16207;font-weight:750}.estado.cobrado{color:#1d4ed8;font-weight:750}.estado.falta{color:#b91c1c;font-weight:750}.flecha{font-size:24px;color:#94a3b8}
        .entrada-extra{margin-top:18px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:15px;box-shadow:0 6px 18px rgba(15,23,42,.04)}.entrada-extra-titulo{font-weight:850;font-size:15px}.entrada-extra-sub{font-size:12px;color:var(--muted);margin:3px 0 11px}.entrada-extra-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.entrada-extra select{min-width:0;width:100%;border:1px solid #cbd5e1;border-radius:12px;background:#fff;padding:12px;font:inherit;color:var(--text)}.entrada-extra button{border:0;border-radius:12px;padding:0 14px;background:#eaf2ff;color:#1d4ed8;font-weight:850;font-size:14px}.administrador{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:25px;padding:17px;background:var(--navy);color:#fff;border-radius:16px;text-decoration:none;font-weight:850;font-size:17px;box-shadow:0 8px 20px rgba(23,52,95,.16)}.ayuda{text-align:center;color:var(--muted);font-size:12px;line-height:1.45;margin:12px 20px 0}.vacio{background:#fff;border:1px dashed #cbd5e1;padding:24px;border-radius:18px;text-align:center;color:var(--muted)}.flash{margin:0 0 14px;padding:12px 14px;border-radius:14px;font-weight:800;font-size:13px}.flash.success{background:#dcfce7;color:#166534}.flash.error{background:#fee2e2;color:#991b1b}
    
:root{
  --vida-yellow:#ffd21a;
  --vida-yellow-2:#f4c400;
  --vida-yellow-soft:#fff6c7;
  --vida-dark:#26292e;
  --vida-dark-2:#34383f;
  --vida-gray:#6b7078;
  --vida-gray-soft:#f1f2f2;
  --vida-border:#d8dade;
  --vida-red:#ef4a2f;
  --vida-cream:#fffdf2;
  --vida-shadow:0 10px 28px rgba(38,41,46,.09);
  --bg:#f2f3f2;
  --panel:#fff;
  --panel-soft:#f7f7f5;
  --text:#26292e;
  --muted:#6b7078;
  --border:#d8dade;
  --navy:#26292e;
  --blue:#9a7100;
  --blue-soft:#fff6c7;
  --shadow:var(--vida-shadow);
}
html,body{background:var(--bg)!important;color:var(--text)!important}
body{background-image:radial-gradient(circle at 100% 0,rgba(255,210,26,.16),transparent 30rem)!important}
::selection{background:var(--vida-yellow);color:var(--vida-dark)}
a{accent-color:var(--vida-yellow-2)}

/* Identidad */
.vida-brand,.vida-admin-brand{display:flex;align-items:center;gap:12px}
.vida-logo{display:block;width:64px;height:64px;object-fit:contain;border-radius:18px;background:#fff;padding:3px;border:1px solid rgba(38,41,46,.10);box-shadow:0 7px 18px rgba(38,41,46,.10)}
.vida-brand-copy{min-width:0}
.vida-kicker{font-size:10px;font-weight:950;letter-spacing:.10em;text-transform:uppercase;color:#775900;margin-bottom:2px}
.vida-name{font-weight:950;letter-spacing:-.045em;color:var(--vida-dark);line-height:1}
.vida-name .vida-word{color:var(--vida-red);text-shadow:0 1px 0 rgba(255,255,255,.7)}
.vida-sub{color:var(--vida-gray);font-size:12px;margin-top:4px}

/* Componentes compartidos */
.card,.tarjeta,.turno,.entrada-extra{border-color:var(--vida-border)!important;box-shadow:var(--vida-shadow)!important}
.turno-header,.horario-cabecera{background:linear-gradient(135deg,#fff8cf,#f2f2ef)!important;border-bottom-color:#e5d98e!important}
.marca,.eyebrow{color:#735700!important;background:var(--vida-yellow-soft)!important}
.boton.navy,.btn{background:var(--vida-dark)!important;color:#fff!important}
.boton.azul{background:var(--vida-yellow)!important;color:var(--vida-dark)!important}
.accion-mini.editar{background:var(--vida-yellow-soft)!important;color:#6f5200!important}
.input:focus,.select:focus,.input-fecha:focus,textarea:focus,input:focus,select:focus{border-color:var(--vida-yellow-2)!important;box-shadow:0 0 0 3px rgba(255,210,26,.24)!important;outline:none}
.volver,.volver-kiosco{color:#6f5200!important}
.volver-kiosco{background:#fff!important;border-color:var(--vida-border)!important}
.section-title a{color:#7b5b00!important}

/* Admin */
.vida-admin-shell{background:linear-gradient(135deg,var(--vida-yellow) 0%,#ffe85e 62%,#fff6bf 100%);border:1px solid #e7c318;border-radius:22px;padding:12px 14px;margin-bottom:17px;box-shadow:0 9px 20px rgba(126,94,0,.12)}
.vida-admin-shell .vida-logo{width:52px;height:52px;border-radius:15px}
.vida-admin-shell .vida-name{font-size:22px}
.vida-admin-shell .vida-kicker{color:#4f4100}
.bottom-nav{background:rgba(38,41,46,.97)!important;border-top-color:#3f434a!important}
.bottom-nav a{color:#c8cbd0!important}
.bottom-nav a.activo{color:var(--vida-yellow)!important;font-weight:900!important}
.bottom-nav a.activo .nav-icon{filter:drop-shadow(0 0 5px rgba(255,210,26,.35))}
.resumen.pagado{background:#e5f8e9!important}
.resumen.pendiente{background:#fff3bd!important}

/* Pantallas kiosco */
.vida-kiosk-hero{background:linear-gradient(145deg,#ffe65a 0%,var(--vida-yellow) 58%,#f4c400 100%);border:1px solid #e7c318;border-radius:26px;padding:15px 17px;margin:0 0 18px;box-shadow:0 12px 28px rgba(126,94,0,.14)}
.vida-kiosk-hero .vida-logo{width:76px;height:76px;border-radius:20px}
.vida-kiosk-hero .vida-name{font-size:30px}
.vida-kiosk-hero .vida-sub{color:#534b27;font-weight:700}
.entrada-extra button{background:var(--vida-yellow)!important;color:var(--vida-dark)!important}

/* Cobros / estados: semánticos intactos, sólo marca */
.total strong,.monto{color:var(--vida-dark)!important}
.tipo{color:#7b5b00!important}
input[type=checkbox]{accent-color:var(--vida-yellow-2)!important}

@media(max-width:430px){
  .vida-kiosk-hero{padding:13px 14px;border-radius:22px}
  .vida-kiosk-hero .vida-logo{width:68px;height:68px}
  .vida-kiosk-hero .vida-name{font-size:26px}
  .vida-admin-shell .vida-name{font-size:20px}
}
